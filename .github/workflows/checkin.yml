name: Auto Check-in

on:
  schedule:
    # 每天 UTC 0:00 执行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发

# 工作流仅需读取仓库代码，避免默认令牌拥有不必要的写入权限。
permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 限制单次运行时长，避免站点请求异常时长期占用运行器。
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run all configured check-ins
        env:
          GITHUB_ACTIONS: true
          YUCHEN_ACCOUNTS: ${{ secrets.YUCHEN_ACCOUNTS }}
          GLADOS_ACCOUNTS: ${{ secrets.GLADOS_ACCOUNTS }}
          AIRPORT_ACCOUNTS: ${{ secrets.AIRPORT_ACCOUNTS }}
          JAVBUS_ACCOUNTS: ${{ secrets.JAVBUS_ACCOUNTS }}
          AUTOCHECK_ACCOUNTS: ${{ secrets.AUTOCHECK_ACCOUNTS }}
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python main.py
